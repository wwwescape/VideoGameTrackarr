name: Release

# This fork builds and publishes its own image to GHCR (ghcr.io/minifluff/videogametrackarr):
# - every push to master rebuilds :latest, so `docker pull` always gets the newest code
# - pushing a version tag (git tag v1.2.0 && git push origin v1.2.0) also tags :<version>
#   and creates a GitHub Release.
#
# (Upstream's Docker Hub publish was removed — those credentials don't exist on this fork.)

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        run: |
          # GHCR image names must be lowercase; this repo's owner/name aren't guaranteed to be.
          ghcr_image="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "ghcr_image=$ghcr_image" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="latest"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # amd64 only: covers typical servers/desktops and keeps builds fast.
          # Upstream also built arm64 via QEMU emulation (slow); re-add
          # `linux/arm64` here if you need Raspberry Pi / Apple Silicon targets.
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.ghcr_image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.ghcr_image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
